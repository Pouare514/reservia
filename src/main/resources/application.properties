server.port=8080
server.compression.enabled=true
spring.application.name=reservation

# Métier externalisé (voir ReservationProperties)
reservation.delai-annulation-minutes=60

# H2 en mémoire + console activée
spring.datasource.url=jdbc:h2:mem:reservations;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schéma versionné par Flyway (db/migration) : Hibernate ne fait que valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf : cache activé = pages servies plus vite (mettre false pour modifier les templates sans restart)
spring.thymeleaf.cache=true

# Observabilité : uniquement health + info (pas de détail, pas de sécurité sur ce projet démo)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Démarrage plus rapide : pas de bannière, pas de JMX, beans paresseux, logs resserrés
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.jmx.enabled=false
logging.level.root=WARN
logging.level.com.reservation=INFO
