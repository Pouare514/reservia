<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Programme — Réservia, la billetterie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg nav-guichet sticky-top">
    <div class="container">
        <a class="marque" th:href="@{/}">Réservia<span class="point">.</span><small>la billetterie</small></a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="lien" th:href="@{/}">Accueil</a></li>
                <li class="nav-item"><a class="lien actif" th:href="@{/services}">Programme</a></li>
                <li class="nav-item"><a class="lien" th:href="@{/creneaux}">Billets</a></li>
                <li class="nav-item"><a class="lien" th:href="@{/reservations}">Mes places</a></li>
                <li class="nav-item ms-lg-2"><a class="btn-encre btn-sm" th:href="@{/admin/creneaux/nouveau}">Ouvrir un créneau</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container section">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show"><span th:text="${succes}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show"><span th:text="${erreur}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="tete-section">
        <div>
            <h1 class="section-titre">Programme</h1>
            <p class="section-chapeau">Tout ce que le guichet délivre, par univers.</p>
        </div>
    </div>

    <div class="filtres mb-4">
        <a th:href="@{/services}" class="filtre" th:classappend="${categorie == null} ? ' actif'">Tout</a>
        <a th:href="@{/services(categorie='CINEMA')}" class="filtre" th:classappend="${categorie?.name() == 'CINEMA'} ? ' actif'">Cinéma</a>
        <a th:href="@{/services(categorie='HOTEL')}" class="filtre" th:classappend="${categorie?.name() == 'HOTEL'} ? ' actif'">Hôtel</a>
        <a th:href="@{/services(categorie='COIFFURE')}" class="filtre" th:classappend="${categorie?.name() == 'COIFFURE'} ? ' actif'">Coiffure</a>
    </div>

    <div class="programme">
        <div class="programme-ligne" th:each="sv : ${services}">
            <div>
                <span class="puce" th:classappend="' puce-' + ${sv.categorie}" th:text="${sv.categorie.label}">Cinéma</span>
                <p class="programme-nom" th:text="${sv.nom}">Dune</p>
                <p class="programme-desc" th:text="${sv.description}">Description</p>
                <p class="programme-meta mb-0">
                    <span th:text="${sv.dureeFormatee}">2h46</span><span>, </span>
                    <span th:text="${#numbers.formatDecimal(sv.prix, 1, 2) + ' €'}">prix</span><span>, </span>
                    <span th:text="${sv.capaciteDefaut} + (${sv.capaciteDefaut > 1} ? ' personnes' : ' personne')">capacité</span>
                </p>
            </div>
            <div class="programme-droit">
                <a class="lien-texte" th:href="@{/creneaux(categorie=${sv.categorie})}">Voir les créneaux</a>
            </div>
        </div>
    </div>
</main>
<footer class="container pied"><b>Réservia</b>, la billetterie. <a href="/api/slots/available">Données en JSON</a></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
