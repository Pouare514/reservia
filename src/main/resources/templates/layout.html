<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Réservia'">Réservia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🎟️ Réservia</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/services}">Services</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/creneaux}">Disponibilités</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservations}">Mes réservations</a></li>
                <li class="nav-item"><a class="btn btn-primary btn-sm ms-2" th:href="@{/admin/creneaux/nouveau}">+ Créneau</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${succes}"></span>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erreur}"></span>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:replace="${content}"></div>
</main>

<footer class="container pb-4 footer text-center">
    <hr/>
    <span>Réservia — démo Spring Boot · Thymeleaf · JPA · H2 · transactions · JUnit</span>
    · <a th:href="@{/h2-console}" target="_blank">Console H2</a>
    · <a href="/api/slots/available">API JSON</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
